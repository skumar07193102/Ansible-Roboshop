- name: "create ec2 instance and route53"
  hosts: local
  connection: local
  vars:
   ami_id: "ami-09c813fb71547fc4f"
   sg_id: "sg-0269c42f363b9217b"
   hosting_zone: Z02845132921NLJI9M7EG
   domain_name: "devsecops86s.space"
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
     name: "{{ item }}"
     instance_type: t3.micro
     security_group: "{{ sg_id }}"
     image_id: "{{ ami_id }}"
     tags:
      name: "{{ item }}"
    loop:
    - mongodb
    - catalogue
    register: ec2_output
  - name: print the ec2 instance output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: route53 record creation
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record_name: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances.private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"

