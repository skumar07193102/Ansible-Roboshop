- name: nginx setup in the server
  hosts: devsecops86s.space
  become: yes
  tasks:
  - name: install the nginx 
    ansible.builtin.command: dnf module install nginx:1.24 -y
  - name: remove the file under /usr/share/nginx/html/* 
    ansible.builtin.file:
      path: /usr/share/nginx/html/* 
      state: absent
  - name: download the frontend code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
      dest: /tmp/frontend.zip
  - name: Extract the file unser /tmp/frontend.zip to /usr/share/nginx/html/* 
    ansible.builtin.unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html/
      remote_src: yes
  - name: Copy the nginx.conf to the /etc/nginx/nginx.conf
    ansible.builtin.copy:
      src: nginx.conf
      dest: /etc/nginx/nginx.conf
  - name: start service
    ansible.builtin.service:
      name: nginx
      status: started
      enabled: yes
  